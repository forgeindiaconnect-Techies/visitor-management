<svg viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 0)">
    <!-- Blue 'F' Frame -->
    <path d="M 60,40 L 440,40 L 360,120 L 140,120 L 140,370 L 60,450 Z" fill="#0056B3" />

    <!-- Yellow Rectangle -->
    <rect x="210" y="195" width="140" height="80" fill="#F5B800" />

    <!-- Blue Elephant Silhouette facing left with trunk up -->
    <g fill="#0056B3">
      <!-- Trunk curling up to the left -->
      <path d="
        M 252,210 
        C 247,214 246,222 254,227 
        C 258,229 261,227 263,223 
        C 265,219 260,217 257,219 
        C 253,221 251,216 254,213 Z
      "/>
      <!-- Head, Ear & Body -->
      <path d="
        M 254,227 
        C 258,222 268,220 274,223 
        C 285,221 300,223 306,230 
        C 309,234 309,240 307,245 
        L 303,258 L 295,258 L 295,245 
        C 290,245 284,245 277,245 
        L 277,258 L 269,258 L 269,236 
        C 264,236 258,232 254,227 Z
      "/>
      <!-- Ear overlay detail -->
      <path d="M 264,225 C 262,230 266,235 270,233 C 272,230 270,226 266,224 Z" fill="#F5B800"/>
      <!-- Tail -->
      <path d="M 306,232 C 309,235 310,240 308,244 L 306,244 C 307,240 306,236 304,233 Z"/>
    </g>

    <!-- Yellow Triangle -->
    <polygon points="280,305 435,460 125,460" fill="#F5B800" />
    
    <!-- Text: FORGE INDIA -->
    <text x="250" y="495" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="900">
      <tspan fill="#0056B3">FORGE </tspan>
      <tspan fill="#F5B800">INDIA</tspan>
    </text>
    
    <!-- Text: CONNECT PVT. LTD. -->
    <text x="250" y="525" font-family="Georgia, serif" font-size="20" fill="#0056B3" text-anchor="middle" font-weight="bold" letter-spacing="1">CONNECT PVT. LTD.</text>

    <!-- Text: SHAPING FUTURE -->
    <text x="250" y="550" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" letter-spacing="2">SHAPING FUTURE</text>
  </g>
</svg>
